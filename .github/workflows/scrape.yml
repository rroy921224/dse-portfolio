name: Scrape DSE Prices

on:
  schedule:
    # Every 15 minutes, but ONLY during DSE trading hours (Sun–Thu, 10:00am–
    # 2:30pm Bangladesh time = 04:00–08:30 UTC). Restricting the trigger
    # itself — not just relying on the script's internal market-hours check
    # — avoids burning compute minutes on runs that would just exit early.
    - cron: "*/15 4-8 * * 0-4"
  workflow_dispatch:
    inputs:
      skip_market_hours_check:
        description: "Force a real scrape even if the market is currently closed (for manual testing)"
        type: boolean
        default: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install shared dependencies
        run: npm install
        working-directory: shared

      - name: Install worker dependencies
        run: npm install
        working-directory: worker

      - name: Run scraper
        run: node scrapeOnce.js
        working-directory: worker
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # On a schedule run, this input doesn't exist, so it defaults to
          # "false" — market hours are enforced as normal. On a MANUAL run,
          # it defaults to "true" (per the input above) — always scrapes,
          # useful for testing regardless of what time it is.
          SKIP_MARKET_HOURS_CHECK: ${{ github.event.inputs.skip_market_hours_check || 'false' }}
