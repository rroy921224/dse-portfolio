name: Scrape DSE Prices

on:
  schedule:
    # Every 15 minutes, but ONLY during DSE trading hours (Sun–Thu, 10:00am–
    # 2:30pm Bangladesh time = 04:00–08:30 UTC). Restricting the trigger
    # itself — not just relying on the script's internal market-hours check
    # — avoids burning compute minutes on runs that would just exit early.
    - cron: "*/15 4-8 * * 0-4"
  workflow_dispatch: {} # lets you manually trigger a run from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node scrapeOnce.js
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SKIP_MARKET_HOURS_CHECK: "false"
